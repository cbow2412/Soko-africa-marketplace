version: '3.8'

services:
  # Main Application Service (Next.js 15 Standalone-style)
  soko-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: soko-africa:latest
    container_name: soko-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis-stack
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - HF_TOKEN=${HF_TOKEN}
      - MILVUS_ADDRESS=milvus:19530
    depends_on:
      redis-stack:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - soko-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.soko-app.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.soko-app.entrypoints=websecure"
      - "traefik.http.routers.soko-app.tls.certresolver=letsencrypt"
      # Nairobi Edge Optimization: Stale-While-Revalidate (SWR) headers for Cloudflare
      - "traefik.http.middlewares.soko-swr.headers.customResponseHeaders.Cache-Control=public, max-age=1, stale-while-revalidate=59"
      - "traefik.http.routers.soko-app.middlewares=soko-swr"

  # GPU-Enabled BullMQ Worker for SigLIP Inference
  soko-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: soko-africa:latest
    container_name: soko-worker
    restart: always
    # The application entrypoint should detect this flag to run only the worker
    command: ["node", "dist/server/index.js", "--worker"]
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis-stack
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - HF_TOKEN=${HF_TOKEN}
      - USE_GPU=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      # Self-Healing Strategy: Restart if the worker or SigLIP model fails
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      redis-stack:
        condition: service_healthy
    networks:
      - soko-network

  # Redis Stack for Task Queue, Persistence, and Rate-Limiting
  redis-stack:
    image: redis/redis-stack:latest
    container_name: soko-redis
    restart: always
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - soko-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Milvus Vector Database for Visual Similarity Search
  milvus:
    image: milvusdb/milvus:latest
    container_name: soko-milvus
    environment:
      COMMON_STORAGETYPE: local
    volumes:
      - milvus_data:/var/lib/milvus
    networks:
      - soko-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  soko-network:
    driver: bridge

volumes:
  redis_data:
  milvus_data:
